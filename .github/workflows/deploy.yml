name: Deploy to Loopia

on:
  push:
    branches: [main]
  workflow_dispatch:

# Två publiceringar tätt efter varandra körs i tur och ordning (aldrig två migreringskörningar samtidigt).
concurrency:
  group: riktiga-crm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publicering från testmiljön: nya migreringar (supabase/migrations) körs mot
      # riktiga databasen innan sidan byggs. Misslyckas en migrering publiceras inget.
      - name: Postgres-klient 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Nya migreringar mot riktiga databasen
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then echo "::warning::PROD_DB_URL saknas — inga migreringar körda."; exit 0; fi
          bash verktyg/kor_migreringar.sh "$PROD_DB_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gpxwfboyjwcaqeinxxwr.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdweHdmYm95andjYXFlaW54eHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgxOTQ4NjMsImV4cCI6MjA3Mzc3MDg2M30.0sgf8vtIRxYj7JcuoEn_RMk5saVclRJISYdFnvsLNxA

      - name: Deploy to Loopia via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
